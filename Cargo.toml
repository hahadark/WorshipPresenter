[workspace]
resolver = "2"
members = ["crates/wp-core", "crates/wp-app", "crates/wp-output"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-or-later"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# [트랙 B] 개발 빌드에서도 의존 크레이트(그림 읽기·PPT 그리기 등)는 최적화 — 썸네일·그림 처리가 수십 배 느리던 것
[profile.dev.package."*"]
opt-level = 2
