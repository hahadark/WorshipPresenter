# 맥(Apple Silicon) 빌드·시험·dmg. 릴리스 올리기는 사람이 확인한 뒤 따로 한다.
name: mac
on:
  push:
    branches: [mac-build]
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 버전
        id: ver
        run: echo "v=$(grep -m1 '^version' crates/wp-core/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: 기본 성경(개역한글) — 공개 릴리스의 포터블 묶음에서
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.0.2 -R hahadark/WorshipPresenter -p 'WorshipPresenter-2.0.2-Portable.zip' -D /tmp/seed
          unzip -o -q /tmp/seed/*.zip bible.db -d /tmp/seed
          ls -la /tmp/seed
      - name: 글꼴 확인 (Apple SD Gothic Neo 면)
        run: |
          pip3 install --quiet --break-system-packages fonttools || pip3 install --quiet fonttools
          python3 - <<'EOF'
          from fontTools.ttLib import TTCollection
          c = TTCollection('/System/Library/Fonts/AppleSDGothicNeo.ttc')
          for i, f in enumerate(c.fonts):
              print(i, f['name'].getDebugName(4))
          EOF
      - name: 시험
        continue-on-error: true
        run: cargo test --workspace 2>&1 | tee /tmp/test.log; grep -E "^test result|FAILED|panicked" /tmp/test.log | head -60
      - name: 맥 키체인 보관 확인
        continue-on-error: true
        run: cargo test -p wp-core keychain -- --nocapture 2>&1 | grep -E "키체인|test result|FAILED"
      - name: 빌드
        run: cargo build --release -p wp-app -p wp-output
      - name: 묶기
        run: bash tools/mac/package.sh "${{ steps.ver.outputs.v }}" /tmp/seed/bible.db
      - name: 실행 시험 (조작 화면 · 예배당 화면)
        continue-on-error: true
        run: |
          set -x
          APP="$PWD/dist-mac/WorshipPresenter.app"
          mkdir -p /tmp/shots /tmp/none
          export WP_LEGACY_DATA=/tmp/none
          "$APP/Contents/MacOS/WorshipPresenter" --data /tmp/wpdata --win 1280x800 --search "요3:16" --send --shot /tmp/shots/main.png &
          P=$!; for i in $(seq 1 90); do [ -f /tmp/shots/main.png ] && break; sleep 1; done; sleep 2; kill $P 2>/dev/null || true
          ls -la /tmp/wpdata || true
          "$APP/Contents/MacOS/WorshipPresenter" --data /tmp/wpdata2 --win 1280x800 --open-c settings --shot /tmp/shots/settings.png &
          P=$!; for i in $(seq 1 90); do [ -f /tmp/shots/settings.png ] && break; sleep 1; done; sleep 2; kill $P 2>/dev/null || true
          # 같은 자료 폴더로 두 번 켜면 두 번째는 막혀야 한다
          "$APP/Contents/MacOS/WorshipPresenter" --data /tmp/wpdata3 --win 1280x800 --search "요3:16" --send &
          P=$!; sleep 15
          ( "$APP/Contents/MacOS/WorshipPresenter" --data /tmp/wpdata3 --win 1280x800 > /tmp/shots/second.txt 2>&1 & S=$!; sleep 8; if kill -0 $S 2>/dev/null; then echo "second=RUNNING"; kill $S; else echo "second=EXITED"; fi )
          PORT=$(lsof -nP -iTCP -sTCP:LISTEN -a -p $P | awk 'NR>1{print $9}' | sed 's/.*://' | head -1); echo "port=$PORT"
          curl -s -o /dev/null -w "outputs/main %{http_code}\n" "http://127.0.0.1:$PORT/outputs/main"
          curl -s -o /dev/null -w "outputs/overlay %{http_code}\n" "http://127.0.0.1:$PORT/outputs/overlay"
          "$APP/Contents/MacOS/wp-output" --url "http://127.0.0.1:$PORT/outputs/main?window=1" --windowed --title "점검" > /tmp/shots/output.txt 2>&1 &
          O=$!; sleep 8; screencapture -x /tmp/shots/screen.png || true; kill $O $P 2>/dev/null || true
          cat /tmp/shots/output.txt; ls -la /tmp/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-${{ steps.ver.outputs.v }}
          path: |
            dist-mac/*.dmg
            /tmp/shots
            /tmp/test.log
          if-no-files-found: warn
