# 웹판(cloud/) 시험 · 배포. 설치판 빌드 작업 흐름과 따로 돈다.
# - web · web-* 가지에 푸시: 단위 시험 · 끝에서 끝 시험(로컬 wrangler dev) · 배포 점검(올리지 않음)
# - 배포는 손으로(workflow_dispatch)만, 저장소 비밀값이 다 있을 때만. 없으면 건너뛴다.
name: Web cloud
on:
  push:
    branches: [web, 'web-*']
    paths: ['cloud/**', 'web/**', 'docs/web/**', 'crates/wp-app/src/menubar.rs', 'crates/wp-app/src/settings_items.rs', 'crates/wp-core/src/parser.rs', 'crates/wp-core/src/books.rs', 'crates/wp-core/data/books.json', '.github/workflows/web-cloud.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: '시험 뒤 Cloudflare 에 올리기 (비밀값이 있어야 함)'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
      - run: npm run check
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WP_AUTH_SECRET: ${{ secrets.WP_AUTH_SECRET }}
      WP_D1_DATABASE_ID: ${{ secrets.WP_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 비밀값 확인
        id: ready
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$WP_AUTH_SECRET" && -n "$WP_D1_DATABASE_ID" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "저장소 비밀값이 없어 배포를 건너뜁니다 (docs/web/architecture.md '로컬 개발 · 시험 · 배포')."
          fi
      - if: steps.ready.outputs.ok == 'true'
        run: npm ci
      - if: steps.ready.outputs.ok == 'true'
        run: node scripts/deploy.mjs
