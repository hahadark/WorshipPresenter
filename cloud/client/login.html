<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>워십프리젠터 웹 — 로그인</title>
<link rel="stylesheet" href="/cloud/cloud.css">
<script type="application/json" id="wp-cfg">"__WP_CLOUD__"</script>
</head>
<body>
<main style="max-width:420px">
  <h1>워십프리젠터 웹</h1>
  <p class="muted">교회 ID 와 받은 열쇠(또는 PIN)를 넣으세요. 열쇠는 주인 화면에서 기기마다 만듭니다.</p>
  <form class="box" id="f">
    <label for="church">교회 ID</label>
    <input id="church" name="church" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    <label for="login">로그인 이름 <span class="muted">(사람 계정만 — 기기 열쇠면 비워 두세요)</span></label>
    <input id="login" name="login" autocomplete="username" autocapitalize="off" spellcheck="false">
    <label for="secret">열쇠 · PIN 또는 비밀번호</label>
    <input id="secret" name="secret" type="password" autocomplete="current-password" required>
    <p class="err" id="err"></p>
    <button class="primary" type="submit" id="go">들어가기</button>
  </form>
  <!-- 7단계: 무료 가입(구글 드라이브에 저장) · 구글로 로그인 · 둘러보기 (docs/web/tiers.md) -->
  <form class="box" id="g">
    <h2 style="margin-top:0">처음이세요?</h2>
    <p class="muted">무료로 시작하면 큐시트 · 찬양 · 성경 · 그림 · 글꼴이 <b>우리 교회의 구글 드라이브</b>('워십프리젠터' 폴더)에 저장됩니다.</p>
    <label for="gname">교회 이름</label>
    <input id="gname" maxlength="60" placeholder="예: 사랑 교회">
    <p class="err" id="gerr"></p>
    <div class="row">
      <button class="primary" type="submit">구글로 무료 시작하기</button>
      <a href="/auth/google/start?mode=login" id="glogin">구글로 로그인</a> ·
      <a href="/demo">로그인 없이 둘러보기</a>
    </div>
  </form>
</main>
<script src="/cloud/login.js"></script>
</body>
</html>
