<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>워십프리젠터 웹 — 로그인</title>
<link rel="stylesheet" href="/cloud/cloud.css">
<script type="application/json" id="wp-cfg">"__WP_CLOUD__"</script>
</head>
<body>
<main class="login">
  <h1>워십프리젠터 웹</h1>

  <!-- 초대 링크로 왔을 때 -->
  <div class="box" id="invite" hidden>
    <p id="invite-text"></p>
    <p class="muted">초대받은 구글 계정으로 로그인하면 바로 들어갑니다.</p>
  </div>

  <!-- 교회가 여럿일 때 고르기 -->
  <div class="box" id="pick" hidden>
    <h2 style="margin-top:0">어느 교회로 들어갈까요?</h2>
    <div id="pick-list" class="stack"></div>
    <p class="err" id="pick-err"></p>
  </div>

  <div id="main">
    <a class="big google" id="google" href="/auth/google/start?mode=login">
      <svg viewBox="0 0 48 48" width="22" height="22" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.7 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.1 5.3-4.6 7l7.1 5.5c4.2-3.9 7.2-9.6 7.2-17z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-2.9-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.6 2.2-8.8 2.2-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      구글로 로그인
    </a>
    <p class="err center" id="gerr2"></p>

    <div class="or"><span>또는</span></div>

    <form class="box" id="pw">
      <label for="pw-login">이름</label>
      <input id="pw-login" autocomplete="username" autocapitalize="off" spellcheck="false" required>
      <label for="pw-pass">비밀번호</label>
      <input id="pw-pass" type="password" autocomplete="current-password" required>
      <p class="err" id="pw-err"></p>
      <button class="primary big" type="submit" id="pw-go">들어가기</button>
    </form>

    <label class="check"><input type="checkbox" id="remember" checked> 이 기기 기억 <span class="muted">(90일 — 여러 사람이 쓰는 PC 면 끄세요)</span></label>

    <details class="box" id="adv">
      <summary>고급: 교회 ID · 기기 열쇠 · PIN</summary>
      <p class="muted">설치판 · OBS · 시험용 열쇠나 리모컨 PIN 으로 들어갈 때만.</p>
      <form id="f">
        <label for="church">교회 ID</label>
        <input id="church" name="church" autocomplete="off" autocapitalize="off" spellcheck="false" required>
        <label for="login">로그인 이름 <span class="muted">(사람 계정만 — 기기 열쇠면 비워 두세요)</span></label>
        <input id="login" name="login" autocomplete="off" autocapitalize="off" spellcheck="false">
        <label for="secret">열쇠 · PIN 또는 비밀번호</label>
        <input id="secret" name="secret" type="password" autocomplete="off" required>
        <p class="err" id="err"></p>
        <button class="primary" type="submit" id="go">들어가기</button>
      </form>
    </details>

    <!-- 7단계: 무료 가입(구글 드라이브에 저장) · 둘러보기 (docs/web/tiers.md) -->
    <details class="box" id="new">
      <summary>새 교회를 무료로 시작하기</summary>
      <form id="g">
        <p class="muted">무료로 시작하면 큐시트 · 찬양 · 성경 · 그림 · 글꼴이 <b>우리 교회의 구글 드라이브</b>('워십프리젠터' 폴더)에 저장됩니다.</p>
        <label for="gname">교회 이름</label>
        <input id="gname" maxlength="60" placeholder="예: 사랑 교회">
        <p class="err" id="gerr"></p>
        <div class="row">
          <button class="primary" type="submit">구글로 무료 시작하기</button>
          <a href="/demo" id="gdemo" hidden>로그인 없이 둘러보기</a>
        </div>
      </form>
    </details>
  </div>
</main>
<script src="/cloud/login.js"></script>
</body>
</html>
