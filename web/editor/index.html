<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#323235">
<meta name="color-scheme" content="dark">
<title>워십프리젠터 웹 편집기</title>
<!-- 웹 편집기 (crates/wp-core/src/webedit.rs): 다른 컴퓨터 · 태블릿의 브라우저에서 큐시트를 고친다.
     모양은 /wpui/wpweb.css(세 웹 화면 공통) + editor.css, 동작은 editor.js. 시험: tools/webedit/e2e.js · tools/webui/e2e.js -->
<link rel="stylesheet" href="/wpui/wpweb.css">
<link rel="stylesheet" href="/editor.css">
</head>
<body data-en-doc="Worship Presenter Web Editor">

<!-- PIN -->
<div id="login" class="gate" hidden>
  <div class="gate-in">
    <div class="brand"><i data-icon="pencil"></i><span data-en="Worship Presenter · Web editor">워십프리젠터 · 웹 편집기</span></div>
    <h1 data-en="Enter the PIN">PIN 을 넣어 주세요</h1>
    <p data-en-html="The PIN you set in <b>Connect → Web editor</b> on the control PC.">조작 PC 의 <b>연결 → 웹 편집기</b> 창에서 정한 PIN 입니다.</p>
    <input class="fld pinfld num" id="pin" type="password" inputmode="numeric" maxlength="12" autocomplete="current-password" enterkeyhint="go" aria-label="PIN">
    <button class="btn send" id="go" data-en="Open">열기</button>
    <div class="msg" id="lerr" role="alert" aria-live="assertive"></div>
    <div class="help" data-en-html="Changes you save here go straight into the cue sheets on the control PC. If someone edits the same cue sheet at the same time, you will be asked before anything is overwritten.">여기서 저장한 것은 조작 PC 의 큐시트에 바로 들어갑니다. 같은 큐시트를 다른 곳에서 동시에 고치면, 덮어쓰기 전에 먼저 묻습니다.</div>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <button class="btn ghost icon-only back" id="back" aria-label="큐시트 목록" data-en-label="Cue sheets"><i data-icon="chevron-left"></i></button>
    <span class="brand"><i data-icon="pencil"></i><span data-en="Web editor">웹 편집기</span></span>
    <span class="cur" id="curName"></span>
    <span class="state" id="state" role="status" aria-live="polite"><i class="dot-s" id="stateDot"></i><span id="msg"></span></span>
    <button class="btn flat" id="reload" data-en-title="Load the latest from the PC (R)" title="PC 에서 최신으로 다시 불러오기"><i data-icon="refresh-cw"></i><span data-en="Reload">다시 불러오기</span></button>
    <button class="btn send" id="save" disabled data-en-title="Save to the PC (Ctrl+S)" title="PC 에 저장 (Ctrl+S)"><i data-icon="save"></i><span data-en="Save">저장</span><kbd>Ctrl S</kbd></button>
  </header>
  <div class="banner" id="banner" hidden role="alert"></div>

  <div class="cols">
    <!-- 큐시트 목록 -->
    <nav class="pane list-pane" aria-label="큐시트" data-en-label="Cue sheets">
      <div class="sh"><span data-en="Cue sheets">큐시트</span><button class="btn ghost sm" id="newBtn"><i data-icon="plus"></i><span data-en="New">새 큐시트</span></button></div>
      <form class="newrow" id="newRow" hidden>
        <input class="fld" id="newname" maxlength="80" placeholder="새 큐시트 이름" data-en-placeholder="New cue sheet name" autocomplete="off">
        <button class="btn" id="new" type="submit" data-en="Create">만들기</button>
      </form>
      <div class="list" id="list"></div>
    </nav>

    <!-- 고치기 -->
    <main class="pane edit-pane" id="edit" tabindex="-1">
      <div class="placeholder" id="placeholder">
        <i data-icon="list"></i>
        <b data-en="Choose a cue sheet">큐시트를 고르세요</b>
        <span class="wide-only" data-en="Pick one from the list on the left, or make a new one.">왼쪽 목록에서 고르거나 새로 만드세요.</span>
      </div>
      <div id="editor" hidden>
        <section class="meta">
          <div class="frm"><label for="cname" data-en="Name">이름</label><input class="fld" id="cname" maxlength="80" autocomplete="off"></div>
          <div class="frm"><label for="cdate" data-en="Service date">예배 날짜</label><input class="fld num" id="cdate" type="date"></div>
          <div class="frm wide"><label for="cmemo" data-en="Memo">메모</label><textarea class="fld" id="cmemo" rows="1" placeholder="진행자끼리 볼 메모 (화면에는 나가지 않음)" data-en-placeholder="Notes for the team (not shown on screen)"></textarea></div>
        </section>
        <div class="sh items-sh"><span><span data-en="Items">순서</span> <em id="count"></em></span><button class="btn ghost sm narrow-only" id="toAdd"><i data-icon="plus"></i><span data-en="Add item">순서 넣기</span></button><span class="keys wide-only" data-en="↑↓ select · Alt+↑↓ move · Enter open · Del delete">↑↓ 고르기 · Alt+↑↓ 옮기기 · Enter 펼치기 · Del 지우기</span></div>
        <div class="items" id="items" role="list"></div>
        <div class="items-empty" id="itemsEmpty" hidden data-en="No items yet. Add one from 'Add item'.">아직 순서가 없습니다. '순서 넣기' 에서 더하세요.</div>
      </div>
    </main>

    <!-- 순서 넣기 -->
    <aside class="pane add-pane" id="addPane" hidden>
      <div class="sh"><span data-en="Add item">순서 넣기</span><em data-en="added at the end">맨 끝에 붙습니다</em></div>
      <div class="adds" id="adds"></div>
      <div class="sh"><span data-en="From the song library">찬양 라이브러리에서</span></div>
      <div class="songfind">
        <div class="search"><i data-icon="search"></i><input class="fld" id="songq" placeholder="제목 · 초성 (예: ㅈㅇㅎ)" data-en-placeholder="Title or initials" autocomplete="off" enterkeyhint="search"></div>
        <div class="songs" id="songs"></div>
      </div>
    </aside>
  </div>
</div>

<script src="/wpui/wpweb.js"></script>
<script src="/editor.js"></script>
</body>
</html>
