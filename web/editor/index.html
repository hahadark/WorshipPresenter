<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111418">
<title>워십프리젠터 웹 편집기</title>
<!-- 웹 편집기 (crates/wp-core/src/webedit.rs): 다른 컴퓨터의 브라우저에서 큐시트를 고친다. 휴대폰 리모컨 화면(web/remote)과 같은 색 -->
<style>
  :root { --bg: #111418; --panel: #1a1f27; --line: #2c3340; --text: #e8ebf0; --muted: #8a93a6; --accent: #3d7bff; --warn: #806a20; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
  body { padding: 12px; }
  button, select { font: inherit; color: var(--text); background: #252c38; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:hover { background: #2e3646; }
  button { white-space: nowrap; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  input, textarea { font: inherit; color: var(--text); background: #0d1014; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; width: 100%; }
  textarea { resize: vertical; min-height: 90px; line-height: 1.45; }
  h1 { font-size: 17px; margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .top .grow { flex: 1; }
  .wrap { display: grid; grid-template-columns: 260px 1fr; gap: 12px; align-items: start; }
  @media (max-width: 760px) { .wrap { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .list button { display: block; width: 100%; text-align: left; margin-bottom: 6px; }
  .list button.on { border-color: var(--accent); background: #1f3a63; }
  .list small { display: block; color: var(--muted); font-size: 12px; }
  .meta { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-bottom: 8px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-top: 8px; background: #151a21; }
  .item .head { display: flex; gap: 6px; align-items: center; }
  .item .head input { flex: 1; font-weight: 700; }
  .item .n { color: var(--muted); min-width: 1.8em; }
  .item .ty { color: var(--muted); font-size: 12px; min-width: 3.5em; }
  .item .body { margin-top: 6px; display: grid; gap: 6px; }
  .add { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .songs { margin-top: 6px; max-height: 220px; overflow: auto; }
  .songs button { display: block; width: 100%; text-align: left; margin-top: 4px; }
  .msg { min-height: 1.4em; margin-left: 8px; }
  .msg.err { color: #ff8a8a; }
  .msg.ok { color: #7fd39b; }
  .login { max-width: 360px; margin: 18vh auto; text-align: center; }
  .login input { font-size: 26px; text-align: center; letter-spacing: 8px; margin: 12px 0; }
  .login button { width: 100%; font-size: 17px; }
  .dirty { border-color: var(--warn) !important; }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <h1>워십프리젠터 웹 편집기</h1>
  <p class="muted">조작 PC 의 도구 → 웹 편집기에 보이는 PIN 을 넣으세요.</p>
  <input id="pin" inputmode="numeric" autocomplete="off" maxlength="12">
  <button class="primary" id="go">열기</button>
  <div class="msg err" id="lerr"></div>
</div>
<div id="app" hidden>
  <div class="top">
    <h1>워십프리젠터 웹 편집기</h1>
    <span class="muted grow">고친 뒤 '저장' 을 누르면 조작 화면에도 바로 들어갑니다.</span>
    <button id="reload">다시 불러오기</button>
    <button class="primary" id="save" disabled>저장</button>
    <span class="msg" id="msg"></span>
  </div>
  <div class="wrap">
    <div class="card">
      <div style="display:flex;gap:6px;margin-bottom:8px">
        <input id="newname" placeholder="새 큐시트 이름">
        <button id="new">만들기</button>
      </div>
      <div class="list" id="list"></div>
    </div>
    <div class="card" id="edit"><span class="muted">왼쪽에서 큐시트를 고르세요.</span></div>
  </div>
</div>
<script>
(function () {
  const TYPES = { title: '제목', song: '찬양', bible: '성경', text: '공지', blank: '빈 화면', hymn: '찬송가·PPT', image: '그림', video: '영상', camera: '카메라', slideshow: '슬라이드쇼', audio: '음악' };
  // 종류별로 고칠 칸: [열쇠, 이름, 여러 줄]
  const FIELDS = { title: [['subtitle', '부제', 0]], song: [['lyrics', '가사 (빈 줄 = 다음 장, [1절] [후렴] 이름표)', 1], ['order', '부를 순서 (예: 1절 후렴 2절 후렴)', 0]], bible: [['ref', '장절 (예: 요 3:16-18)', 0]], text: [['body', '글 (--- 줄 = 다음 장)', 1]] };
  let pin = sessionStorage.getItem('wp-edit-pin') || '';
  let cur = null, dirty = false, songQ = '';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function say(t, ok) { const m = $('msg'); m.textContent = t || ''; m.className = 'msg ' + (ok ? 'ok' : 'err'); }
  async function api(path, body) {
    const h = { 'X-PIN': pin };
    const opt = body ? { method: 'POST', headers: Object.assign(h, { 'Content-Type': 'application/json', 'X-WorshipCue': '1' }), body: JSON.stringify(body) } : { headers: h };
    const r = await fetch(path, opt);
    const j = await r.json().catch(() => ({ ok: false, error: '응답을 읽지 못했습니다.' }));
    if (r.status === 401 || r.status === 429 || (r.status === 403 && !body)) { showLogin(j.error); throw new Error(j.error); }
    return j;
  }
  function showLogin(e) { $('app').hidden = true; $('login').hidden = false; $('lerr').textContent = e || ''; $('pin').focus(); }
  function setDirty(on) { dirty = on; $('save').disabled = !on || !cur; $('edit').classList.toggle('dirty', on); }
  async function loadList() {
    const j = await api('/e/state');
    if (!j.ok) return say(j.error);
    $('login').hidden = true; $('app').hidden = false;
    $('list').innerHTML = (j.cues || []).map((c) => `<button data-id="${esc(c.id)}" class="${cur && cur.id === c.id ? 'on' : ''}">${esc(c.name)}${c.id === j.active ? ' <span class="muted">(조작 화면에 열림)</span>' : ''}<small>${esc(c.serviceDate || '')} · 순서 ${c.count}개${c.template ? ' · 서식' : ''}</small></button>`).join('') || '<span class="muted">큐시트가 없습니다.</span>';
  }
  async function open(id) {
    if (dirty && !confirm('저장하지 않은 고침이 있습니다. 버리고 다른 큐시트를 열까요?')) return;
    const j = await api('/e/cue?id=' + encodeURIComponent(id));
    if (!j.ok) return say(j.error);
    cur = j.cue; setDirty(false); say(''); draw(); loadList();
  }
  function draw() {
    if (!cur) return;
    const it = cur.items;
    let h = `<div class="meta"><input id="cname" value="${esc(cur.name)}" placeholder="큐시트 이름"><input id="cdate" value="${esc(cur.serviceDate)}" placeholder="예배 날짜 (2026-12-06)"></div>`;
    h += `<textarea id="cmemo" placeholder="메모" style="min-height:44px">${esc(cur.memo)}</textarea>`;
    it.forEach((x, k) => {
      h += `<div class="item" data-k="${k}"><div class="head"><span class="n">${k + 1}</span><span class="ty">${esc(TYPES[x.type] || x.type)}</span><input data-f="title" value="${esc(x.title)}">`;
      h += `<button data-mv="-1" title="위로" ${k === 0 ? 'disabled' : ''}>위</button><button data-mv="1" title="아래로" ${k === it.length - 1 ? 'disabled' : ''}>아래</button><button data-del="1">지우기</button></div><div class="body">`;
      for (const [f, label, multi] of FIELDS[x.type] || []) {
        h += multi ? `<textarea data-f="${f}" placeholder="${esc(label)}">${esc(x[f])}</textarea>` : `<input data-f="${f}" value="${esc(x[f])}" placeholder="${esc(label)}">`;
      }
      h += `<input data-f="note" value="${esc(x.note)}" placeholder="진행 메모 (화면에는 안 나감)"></div></div>`;
    });
    h += `<div class="add"><span class="muted" style="align-self:center">순서 더하기:</span>` + ['title', 'song', 'bible', 'text', 'blank'].map((t) => `<button data-add="${t}">${TYPES[t]}</button>`).join('') + `</div>`;
    h += `<div style="margin-top:10px"><input id="songq" placeholder="찬양 라이브러리에서 곡 찾아 더하기 (제목·초성)" value="${esc(songQ)}"><div class="songs" id="songs"></div></div>`;
    $('edit').innerHTML = h;
  }
  $('edit').addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'cname') cur.name = t.value; else if (t.id === 'cdate') cur.serviceDate = t.value; else if (t.id === 'cmemo') cur.memo = t.value;
    else if (t.id === 'songq') { songQ = t.value; findSongs(); return; }
    else if (t.dataset.f) { const k = +t.closest('.item').dataset.k; cur.items[k][t.dataset.f] = t.value; }
    else return;
    setDirty(true);
  });
  $('edit').addEventListener('click', async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const box = b.closest('.item'); const k = box ? +box.dataset.k : -1;
    if (b.dataset.mv) { const j = k + +b.dataset.mv; [cur.items[k], cur.items[j]] = [cur.items[j], cur.items[k]]; }
    else if (b.dataset.del) { if (!confirm(`'${cur.items[k].title || ''}' 순서를 지울까요?`)) return; cur.items.splice(k, 1); }
    else if (b.dataset.add) { const t = b.dataset.add; cur.items.push({ type: t, title: TYPES[t], subtitle: '', lyrics: '', ref: '', body: '', note: '', order: '' }); }
    else if (b.dataset.song) { const j = await api('/e/song', { id: b.dataset.song }); if (!j.ok) return say(j.error); const x = j.item; cur.items.push({ type: 'song', title: x.title, lyrics: x.lyrics || '', order: x.order || '', note: x.note || '', songId: x.songId || '', credit: x.credit || '' }); }
    else return;
    setDirty(true); draw();
  });
  let songTimer = 0;
  function findSongs() {
    clearTimeout(songTimer);
    songTimer = setTimeout(async () => {
      if (!songQ.trim()) { $('songs').innerHTML = ''; return; }
      const j = await api('/e/songs?q=' + encodeURIComponent(songQ.trim()));
      $('songs').innerHTML = (j.songs || []).map((s) => `<button data-song="${esc(s.id)}">${esc(s.title)} <span class="muted">${esc([s.key ? 'Key ' + s.key : '', s.credit].filter(Boolean).join(' · '))}</span></button>`).join('') || '<span class="muted">찾은 곡이 없습니다.</span>';
    }, 250);
  }
  $('save').onclick = async () => {
    if (!cur) return;
    const items = cur.items;
    const j = await api('/e/save', { id: cur.id, base: cur.updatedAt, name: cur.name, serviceDate: cur.serviceDate, memo: cur.memo, items });
    if (j.conflict) { say(j.error); return; }
    if (!j.ok) return say(j.error);
    cur = j.cue; setDirty(false); draw(); loadList(); say('저장했습니다.', true);
  };
  $('reload').onclick = () => { if (cur) { dirty = false; open(cur.id); } else loadList(); };
  $('list').onclick = (e) => { const b = e.target.closest('button[data-id]'); if (b) open(b.dataset.id); };
  $('new').onclick = async () => { const j = await api('/e/new', { name: $('newname').value }); if (!j.ok) return say(j.error); $('newname').value = ''; dirty = false; await loadList(); open(j.cue.id); };
  $('go').onclick = async () => { pin = $('pin').value.trim(); sessionStorage.setItem('wp-edit-pin', pin); try { await loadList(); } catch (_) {} };
  $('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
  window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  loadList().catch(() => {});
})();
</script>
</body>
</html>
