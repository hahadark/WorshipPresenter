<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#323235">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>워십프리젠터 휴대폰 카메라</title>
<!-- 휴대폰을 카메라로 (crates/wp-core/src/phonecam.rs, https 37560 · WebRTC). 공통 모양 /wpui/wpweb.css + cam.css, 동작 cam.js -->
<link rel="stylesheet" href="/wpui/wpweb.css">
<link rel="stylesheet" href="/cam.css">
</head>
<body data-en-doc="Worship Presenter Phone Camera">
<main class="cam" id="app">
  <header class="top">
    <span class="dot" id="dot"></span>
    <div class="stt"><b id="st" role="status" aria-live="polite" data-en="Opening the camera…">카메라를 여는 중…</b><small id="sub"></small></div>
    <button class="btn ghost icon-only" id="menuBtn" aria-label="설정" data-en-label="Settings" aria-haspopup="dialog"><i data-icon="ellipsis"></i></button>
  </header>
  <ol class="steps" id="steps" aria-label="연결 단계" data-en-label="Steps">
    <li id="s1"><i>1</i><span data-en="Allow camera">카메라 허락</span></li>
    <li id="s2"><i>2</i><span data-en="Connect to PC">PC 와 연결</span></li>
    <li id="s3"><i>3</i><span data-en="Sending video">영상 보내기</span></li>
  </ol>

  <div class="view" id="view">
    <video id="v" autoplay muted playsinline></video>
    <span class="tag air" id="air" hidden></span>
    <span class="tag info num" id="meta" hidden></span>
    <div class="hint" id="hint" hidden>
      <div class="hint-in"><i class="hic" id="hintIcon"></i><b id="hintTitle"></b><p id="hintText"></p><button class="btn send" id="start" hidden></button></div>
    </div>
    <button class="cover" id="cover" hidden><span data-en="Screen dimmed — the video keeps going to the PC. Tap to show.">화면만 가렸습니다 — 영상은 PC 로 계속 갑니다. 누르면 다시 보입니다.</span></button>
  </div>

  <aside class="panel">
    <div class="rotate" id="rotate" hidden><i data-icon="smartphone"></i><span id="rotateText"></span></div>
    <div class="ctl">
      <button class="btn" id="flip"><i data-icon="switch-camera"></i><span id="flipText" data-en="Front camera">앞 카메라로</span></button>
      <div class="seg res" role="radiogroup" aria-label="화질" data-en-label="Quality">
        <button id="res" data-q="1080" class="on" role="radio" aria-checked="true">1080p</button>
        <button id="res720" data-q="720" role="radio" aria-checked="false">720p</button>
      </div>
    </div>
    <label class="lbl" for="name" data-en="Name in the PC camera list">PC 카메라 목록에 보일 이름</label>
    <input class="fld" id="name" maxlength="30" placeholder="예: 강단 정면" data-en-placeholder="e.g. Front of stage" enterkeyhint="done" autocomplete="off">
    <div class="foot">
      <p id="battery"><i data-icon="battery"></i><span data-en="Plug in a charger. If the phone gets hot, switch to 720p.">충전기를 꽂아 두세요. 휴대폰이 뜨거워지면 720p 로 낮추세요.</span></p>
      <p><i data-icon="smartphone"></i><span data-wake></span></p>
    </div>
  </aside>
</main>

<div id="menu" hidden>
  <div class="sheet-back" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
    <div class="sh"><span id="menuTitle" data-en="Camera settings">카메라 설정</span><button class="btn ghost icon-only" data-close aria-label="닫기" data-en-label="Close"><i data-icon="x"></i></button></div>
    <button class="row tap" id="optCover"><i data-icon="eye-off"></i><div><b data-en="Black out this screen">이 화면 가리기</b><small data-en="Keeps sending video but the phone screen goes dark — no glow at the front of the sanctuary.">영상은 계속 보내고 휴대폰 화면만 검게 — 예배당 앞에서 빛나지 않게</small></div></button>
    <div class="row"><i data-icon="moon"></i><div><b data-en="Dim this screen">화면 어둡게</b><small data-en="Only the preview on this phone gets darker">이 휴대폰의 미리보기만 어두워집니다</small></div><button class="sw" id="optDim" role="switch" aria-checked="false" aria-label="화면 어둡게" data-en-label="Dim"></button></div>
    <div class="row"><i data-icon="info"></i><div><b data-en="Good to know">알아 둘 것</b><small data-en="Video stops if you switch apps or lock the phone. No sound is sent. Use the phone's own camera app to check focus.">다른 앱으로 가거나 휴대폰을 잠그면 영상이 멈춥니다. 소리는 보내지 않습니다.</small></div></div>
    <div class="foot" id="menuFoot"></div>
  </div>
</div>

<script src="/wpui/wpweb.js"></script>
<script src="/cam.js"></script>
</body>
</html>
