[package]
name = "wp-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
axum = "0.8.9"
# [트랙 A] PPT 직접 읽기·그리기: cfb · image · resvg · roxmltree · zip
cfb = "0.16.0"
dirs = "7.0.0"
futures-util = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
log = "0.4.35"
miniz_oxide = "0.9.1"
once_cell = "1.21.4"
parking_lot = "0.13.0"
rand = "0.10.3"
regex = "1.13.1"
resvg = "0.50.0"
roxmltree = "0.21.2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
unicode-normalization = "0.1.26"
# [트랙 A] PPT 나누기 AI (오픈라우터)
ureq = { version = "3.5.1", features = ["json"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_SystemInformation"] } # [트랙 B] 시간대
