[package]
name = "wp-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
log = "0.4.35"
once_cell = "1.21.4"
parking_lot = "0.13.0"
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false }
rfd = "0.18.0"
rodio = "0.23.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
wp-core = { version = "0.1.0", path = "../wp-core" }
