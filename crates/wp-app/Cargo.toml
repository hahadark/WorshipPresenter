[package]
name = "wp-app"
version = "2.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
log = "0.4.35"
once_cell = "1.21.4"
parking_lot = "0.13.0"
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false }
serde_json = "1.0.154"
web-time = "1.1.0" # [웹판] 브라우저에서 std::time::Instant 는 panic → 대체 (설치판에서는 std 그대로)
wp-core = { version = "2.0.1", path = "../wp-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] } # 예배당·무대 창을 조작 화면과 함께 끄기

# [웹판] 설치판에서만: 창·그래픽(wgpu) · 파일 대화상자 · 소리 장치 · 서버 실행기. docs/web/egui-web.md
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = "0.37.0"
rfd = "0.18.0"
rodio = "0.23.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

# [웹판] 브라우저(wasm32): 캔버스(WebGL) · 파일 대화상자 자리(wp-web-rfd) · 소리는 브라우저가
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
wp-web-rfd = { path = "../wp-web-rfd" } # 라이브러리 이름이 rfd → 코드의 rfd::FileDialog 가 그대로 컴파일된다
tokio = { version = "1.54.1", features = ["sync", "macros", "rt"] }
rodio = { version = "0.23.0", features = ["wasm-bindgen"] } # 소리 장치는 브라우저의 Web Audio
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "Location", "Storage", "console", "Performance", "BroadcastChannel", "MessageEvent", "Navigator", "UrlSearchParams", "Url", "Request", "Response", "DomTokenList", "Screen"] }
