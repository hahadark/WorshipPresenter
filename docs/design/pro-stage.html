<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<title>(나) 어두운 전문가용 맥 — 무대 화면 창</title>
<script src="common.js"></script>
<style>
@font-face{font-family:'Pretendard';src:url('../../../src/web/shared/fonts/PretendardVariable.woff2') format('woff2');font-weight:100 900}
:root{--base:#1f1f21;--panel:#2a2a2c;--head:#323235;--bar:#3a3a3d;--field:#1c1c1e;--edge:#151516;--line:#3c3c3f;--text:#e6e6e8;--text2:#c4c4c8;--sec:#9d9da3;--ter:#6c6c72;--accent:#f0c419;--live:#e5372e;--lcd:#181a1c;--lcd-t:#e3e9ea;--lcd-l:#7b878c}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1600px;height:960px;font:12.5px/1.35 'Pretendard',sans-serif;color:var(--text);background:#141415;display:flex;align-items:center;justify-content:center;word-break:keep-all}
.win{zoom:1.35;width:820px;background:var(--panel);border-radius:10px;border:1px solid #4a4a4d;box-shadow:0 18px 40px rgba(0,0,0,.5);overflow:hidden}
.tb{height:38px;background:var(--bar);box-shadow:inset 0 1px 0 #4a4a4e;border-bottom:1px solid var(--edge);display:flex;align-items:center;padding:0 12px 0 14px;gap:8px}
.lights{display:flex;gap:8px;margin-right:10px}.lights i{width:12px;height:12px;border-radius:50%;background:#5a5a5e}
.tb b{font-size:12.5px}.tb .s{color:var(--sec);font-size:11.5px}
.sp{flex:1}
.lcd{margin:14px;background:var(--lcd);border-radius:6px;box-shadow:inset 0 1px 2px #000;display:grid;grid-template-columns:1fr 1px 210px;align-items:center;color:var(--lcd-t)}
.lcd>i{height:70%;background:#2c3033}
.lcd div{padding:12px 16px}
.lcd small{display:block;font-size:10px;color:var(--lcd-l);font-weight:600}
.lcd .clk{font-size:60px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.lcd .clk em{font-style:normal;font-size:16px;color:var(--lcd-l);font-weight:500;margin-left:8px}
.lcd .lvl{padding:0;height:4px;background:#2c3033;border-radius:2px;margin-top:10px}.lvl i{display:block;height:100%;width:38%;background:var(--lcd-t);border-radius:2px}
.lcd .side b{display:block;font-size:13px;margin-bottom:6px}
.lcd .side .on{color:#7fd69b}
.grid{display:grid;grid-template-columns:1fr 250px;border-top:1px solid var(--edge)}
.sh{height:26px;display:flex;align-items:center;padding:0 12px;background:#303033;border-bottom:1px solid var(--edge);border-top:1px solid #3a3a3d;font-size:11.5px;font-weight:600}
.fm{display:grid;grid-template-columns:86px 1fr;gap:7px 8px;align-items:center;padding:10px 12px}
.fm label{text-align:right;color:var(--sec);font-size:11.5px}
.r{display:flex;gap:4px;align-items:center}
.b{height:24px;padding:0 10px;border-radius:5px;background:#48484b;box-shadow:inset 0 1px 0 #555559,0 1px 0 var(--edge);display:inline-flex;align-items:center;font-size:12px}
.b.on{background:#68686c;color:#fff}
.b.acc{background:var(--accent);color:#1a1a1a;font-weight:700;box-shadow:inset 0 1px 0 #ffe27a,0 1px 0 var(--edge)}
.fld{height:24px;background:var(--field);border-radius:4px;box-shadow:inset 0 1px 1px #000;display:flex;align-items:center;padding:0 8px;font-size:12px;flex:1}
.segx{display:flex;background:var(--field);border-radius:5px;padding:1px;box-shadow:inset 0 1px 1px #000}
.segx span{padding:3px 12px;border-radius:4px;color:var(--sec);font-size:11.5px}.segx span.on{background:#58585c;color:var(--text)}
.rp{border-left:1px solid var(--edge);background:#262628}
.stg{margin:12px;aspect-ratio:16/10;background:#000;padding:10px;position:relative;box-shadow:0 0 0 1px #000,0 0 0 2px #444}
.stg .t{color:#fff;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}.stg .c{color:#fff;font-size:11.5px;margin-top:4px}.stg .n{color:var(--accent);font-size:11px;margin-top:2px}
.stg .m{position:absolute;left:0;right:0;bottom:0;background:var(--accent);color:#1a1a1a;font-size:11px;font-weight:700;padding:5px 8px}
.kv{display:flex;justify-content:space-between;font-size:11.5px;padding:6px 12px;border-top:1px solid var(--line)}
.kv span:first-child{color:var(--sec)}
</style></head><body>
<div class="win">
  <div class="tb"><div class="lights"><i></i><i></i><i></i></div><b>무대 화면</b><span class="s">— 설교자에게만</span><span class="sp"></span><div class="segx"><span class="on">타이머</span><span>메시지</span><span>고정</span></div></div>
  <div class="lcd">
    <div><small>설교 타이머 · 남은 시간</small><div class="clk">18:36<em>/ 30:00</em></div><div class="lvl"><i></i></div></div><i></i>
    <div class="side"><small>상태</small><b class="on">진행 중</b><small>마침 예정</small><b>11:57</b></div>
  </div>
  <div class="grid">
    <div>
      <div class="sh">▾ 타이머</div>
      <div class="fm"><label>길이</label><div class="r"><span class="b">5</span><span class="b">10</span><span class="b">20</span><span class="b on">30</span><span class="b">40</span><span class="b">직접…</span></div>
        <label>끝 시각</label><div class="r"><div class="fld" style="flex:0 0 70px">12:00</div><span class="b">까지로 맞추기</span></div>
        <label>조절</label><div class="r"><span class="b">일시정지</span><span class="b">−1분</span><span class="b">+1분</span><span class="b">처음으로</span></div></div>
      <div class="sh">▾ 무대 메시지</div>
      <div class="fm"><label>글</label><div class="r"><div class="fld">5분 남았습니다 — 마무리해 주세요</div></div>
        <label></label><div class="r"><span class="b acc">보내기 ⏎</span><span class="b">내리기</span></div></div>
      <div class="sh">▾ 계속 보일 것</div>
      <div class="fm"><label>고정</label><div class="segx" style="width:max-content"><span class="on">순서표</span><span>고정 글</span><span>없음</span></div></div>
    </div>
    <div class="rp">
      <div class="stg"><div class="t">18:36</div><div class="c">지금 · 7 설교</div><div class="n">다음 · 8 헌신 찬양</div><div class="m">5분 남았습니다 — 마무리해 주세요</div></div>
      <div class="kv"><span>모니터</span><span>3번 · 켜짐</span></div><div class="kv"><span>프리셋</span><span>주일 설교</span></div><div class="kv"><span>태블릿·OBS</span><span>주소 복사</span></div><div class="kv"><span>자동 시작</span><span>'설교' 송출 때</span></div>
    </div>
  </div>
</div>
</body></html>
